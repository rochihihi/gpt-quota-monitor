<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPT 额度监控</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17233c;font:15px system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1180px;margin:30px auto;padding:0 20px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:22px;margin-bottom:24px}.brand h1{margin:0;font-size:30px}.brand p{margin:8px 0;color:#64748b}.login{width:430px;background:linear-gradient(135deg,#163b78,#2563eb);color:#fff;border-radius:18px;padding:18px;box-shadow:0 10px 25px #2557a733}.login h2{margin:0 0 12px;font-size:17px}.login .row{display:flex;gap:8px}.login input{min-width:0;flex:1;background:#ffffff18;color:#fff;border-color:#ffffff66}.login input::placeholder{color:#dce8ff}.login button{background:#fff;color:#1f4fa3}.info{margin-top:12px;line-height:1.8}.info b{font-size:19px;letter-spacing:1px}.copy{background:#dbeafe!important;color:#164e9b!important;padding:5px 8px!important;font-size:12px}.panel{background:#fff;border:1px solid #e5eaf2;border-radius:16px;box-shadow:0 5px 20px #19335c12;padding:16px;margin-bottom:17px}.panel form{display:flex;gap:8px}.panel input{flex:1;padding:10px 12px;border:1px solid #cbd5e1;border-radius:9px}.button{padding:10px 14px;border:0;border-radius:9px;background:#2563eb;color:#fff;cursor:pointer}.toolbar{display:flex;align-items:center;gap:12px;margin:4px 0 14px}.muted{color:#64748b;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:16px;padding:18px;box-shadow:0 5px 20px #19335c12;cursor:grab;transition:transform .2s,box-shadow .2s,opacity .2s}.card.dragging{opacity:.45;transform:scale(.98);box-shadow:0 14px 30px #19335c2b}.card.drop-target{transform:translateY(-5px);border-color:#3b82f6}.card h3{margin:0 0 15px}.bar{height:12px;background:#e8edf5;border-radius:9px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa);transition:width .5s ease}.card p{margin:10px 0}.actions{margin-top:15px;display:flex;gap:8px}.actions button{border:0;border-radius:8px;padding:7px 10px;cursor:pointer}.secondary{background:#e8eef8;color:#1e3a6d}.danger{background:#dc2626;color:#fff}.error{color:#b42318}@media(max-width:900px){.top{flex-direction:column}.login{width:100%}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.grid{grid-template-columns:1fr}.panel form{flex-direction:column}}
</style><main><div class=top><div class=brand><h1>GPT / Codex 多账号额度监控</h1><p>实时查看 5 小时窗口和周额度 · 拖动卡片调整顺序</p></div><section class=login><h2>浏览器设备登录</h2><form id=deviceForm class=row><input id=deviceLabel placeholder="账号标签（可选）"><button class=button>获取登录信息</button></form><div id=deviceInfo class=info></div></section></div>
<div class=toolbar><button class="button secondary" id=refresh>立即刷新</button><span id=last class=muted>尚未刷新</span></div><div id=cards class=grid></div></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),remaining=w=>w?Math.max(0,100-(w.used_percent||0)):null,resetAt=w=>w&&w.reset_at?new Date(w.reset_at*1000).toLocaleString():'—';
function actions(a){return `<div class=actions><button class=secondary onclick="renameAccount('${a.id}')">编辑标签</button><button class=danger onclick="deleteAccount('${a.id}')">删除账号</button></div>`}
function render(a){if(a.error)return `<article class=card data-id="${a.id}"><h3>${esc(a.label)}</h3><p class=error>${esc(a.error)}</p><p class=muted>本次刷新：${new Date(a.refreshed_at).toLocaleString()}</p>${actions(a)}</article>`;let p=remaining(a.primary),s=remaining(a.secondary);return `<article class=card data-id="${a.id}"><h3>${esc(a.label)}</h3><p>5 小时剩余：<b>${p??'—'}%</b></p><div class=bar><div class=fill style="width:${p||0}%"></div></div><p class=muted>5 小时下次重置：${resetAt(a.primary)}</p><p>周额度剩余：<b>${s??'—'}%</b></p><div class=bar><div class=fill style="width:${s||0}%"></div></div><p class=muted>周额度下次重置：${resetAt(a.secondary)}<br>本次刷新：${new Date(a.refreshed_at).toLocaleString()}</p>${actions(a)}</article>`}
async function load(){const r=await fetch('/api/usage?ts='+Date.now()),d=await r.json();$('cards').innerHTML=d.map(render).join('')||'<p>暂无账号</p>';$('last').textContent='刷新完成：'+new Date().toLocaleString();enableDrag()}
async function renameAccount(id){const c=document.querySelector(`[data-id="${id}"]`),old=c.querySelector('h3').textContent,n=prompt('输入新标签',old);if(!n||n===old)return;const r=await fetch('/api/accounts/action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'rename',id,label:n})});if(!r.ok)alert('编辑失败');await load()}
async function deleteAccount(id){if(!confirm('确定删除这个账号？'))return;const r=await fetch('/api/accounts/action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'delete',id})});if(!r.ok)alert('删除失败');await load()}
function enableDrag(){let from;document.querySelectorAll('.card').forEach(c=>{c.draggable=true;c.ondragstart=()=>{from=c;c.classList.add('dragging')};c.ondragend=()=>{c.classList.remove('dragging');document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'))};c.ondragover=e=>{e.preventDefault();if(c!==from)c.classList.add('drop-target')};c.ondragleave=()=>c.classList.remove('drop-target');c.ondrop=async e=>{e.preventDefault();if(!from||from===c)return;const rect=c.getBoundingClientRect(),after=e.clientY>rect.top+rect.height/2;c.classList.remove('drop-target');if(after)c.after(from);else c.before(from);const ids=[...$('cards').children].map(x=>x.dataset.id);await fetch('/api/accounts/reorder',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ids})});from=null}})}
$('deviceForm').onsubmit=async e=>{e.preventDefault();$('deviceInfo').textContent='正在申请设备码…';try{const r=await fetch('/api/device/start',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({label:$('deviceLabel').value})}),d=await r.json();if(!r.ok)throw Error(d.error||r.status);$('deviceInfo').innerHTML=`打开 <a href="${esc(d.verification_url)}" target="_blank">登录页面</a>，验证码：<b>${esc(d.user_code)}</b> <button class=copy onclick="copyText('${esc(d.verification_url)}')">复制网址</button> <button class=copy onclick="copyText('${esc(d.user_code)}')">复制验证码</button>`}catch(e){$('deviceInfo').innerHTML='<span class=error>'+esc(e.message)+'</span>'}};async function copyText(v){await navigator.clipboard.writeText(v);alert('已复制')}$('refresh').onclick=load;load();setInterval(load,60000);
</script></html>
